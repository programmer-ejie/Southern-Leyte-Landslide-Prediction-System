services:
  db:
    image: postgis/postgis:16-3.4
    container_name: landslide_postgis
    environment:
      POSTGRES_DB: landslide_db
      POSTGRES_USER: landslide_user
      POSTGRES_PASSWORD: landslide_pass
    ports:
      - "5433:5432"
    volumes:
      - landslide_pgdata:/var/lib/postgresql/data

volumes:
  landslide_pgdata:
